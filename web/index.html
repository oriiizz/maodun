<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>与茅盾对话</title>
  <link rel="stylesheet" href="/assets/style.css?v=10" />
</head>
<body>
  <header class="top">
    <a class="brand" href="/">中国现代文学馆</a>
    <a class="text-link" href="/admin">资料与设置</a>
  </header>
  <main class="shell">
    <section class="voice-pane" aria-label="语音">
      <div class="voice-intro">
        <p class="eyebrow">中国现代文学馆 · 数字化模拟</p>
        <h1>与茅盾对话</h1>
        <p class="lede">回答依据已导入的馆藏资料。这是数字化模拟，不是茅盾本人。</p>
      </div>
      <div class="voice-stack">
        <div class="voice-center">
          <section id="stage" class="stage" data-mode="idle" aria-hidden="true"></section>
          <button type="button" id="mic" class="voice-button" data-state="idle" aria-label="点击说话">
            <span class="voice-glyph" aria-hidden="true">
              <svg class="glyph glyph-mic" viewBox="0 0 24 24"><path d="M12 3.5a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0v-5a3 3 0 0 0-3-3Z"/><path d="M7 11.5a5 5 0 0 0 10 0M12 16.5v3.5M8.5 20h7"/></svg>
              <svg class="glyph glyph-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
              <svg class="glyph glyph-think" viewBox="0 0 24 24"><circle cx="7" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="17" cy="12" r="1.4"/></svg>
              <svg class="glyph glyph-play" viewBox="0 0 24 24"><path d="M8 7.5v9M12 5.5v13M16 8.5v7"/></svg>
            </span>
          </button>
        </div>
        <p id="voice-caption" class="voice-caption" aria-live="polite">点击说话</p>
        <p id="status-line" class="status-line">准备好了，点击开始</p>
      </div>
      <div class="voice-actions">
        <button type="button" id="cancel" class="quiet-button">停止当前回答</button>
        <span aria-hidden="true">·</span>
        <button type="button" id="new-session" class="quiet-button">开始新对话</button>
      </div>
    </section>
    <section class="chat-column">
      <div class="chat-tools">
        <button type="button" id="history-toggle" class="quiet-button">历史对话</button>
        <button type="button" id="download-chat" class="quiet-button">下载当前对话</button>
        <button type="button" id="delete-chat" class="quiet-button">删除当前对话</button>
        <button type="button" id="delete-all" class="quiet-button">删除全部历史</button>
      </div>
      <div id="history-panel" class="history-panel" hidden></div>
      <div class="log-wrap">
        <div id="log" class="log" role="log" aria-label="对话记录"></div>
        <p class="log-empty">对话会显示在这里</p>
        <button type="button" id="jump-latest" class="jump-latest" hidden>回到最新消息</button>
      </div>
      <form id="text-form" class="composer">
        <label class="sr-only" for="question">文字问题</label>
        <textarea id="question" rows="1" placeholder="输入文字" autocomplete="off"></textarea>
        <button type="submit" class="send-button" aria-label="发送">↑</button>
      </form>
    </section>
  </main>
  <script type="module" src="/assets/app.js?v=13"></script>
</body>
</html>
